version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: saas_starter.settings.development
      DATABASE_URL: postgres://saas:saas@db:5432/saas
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A saas_starter worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: saas_starter.settings.development
      DATABASE_URL: postgres://saas:saas@db:5432/saas
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A saas_starter beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: saas_starter.settings.development
      DATABASE_URL: postgres://saas:saas@db:5432/saas
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
