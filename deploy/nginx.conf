server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;  # CUSTOMIZE

    # If behind Cloudflare, this is fine — CF handles HTTPS.
    # If direct SSL, add ssl_certificate / ssl_certificate_key here.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WhiteNoise serves static files directly from Gunicorn — no separate
    # static location needed. If you prefer nginx to serve static:
    # location /static/ {
    #     alias /var/www/saas-starter/staticfiles/;
    # }

    client_max_body_size 10M;
}
