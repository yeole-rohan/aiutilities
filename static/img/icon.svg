<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark navy rounded square -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>

  <!-- Green glow ring (subtle) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#16a34a" stroke-width="6" opacity="0.18"/>

  <!-- Sparkle / AI node — 4-point diamond star -->
  <path d="M256 80 C256 80 268 188 294 222 C320 256 420 256 420 256
           C420 256 320 256 294 290 C268 324 256 432 256 432
           C256 432 244 324 218 290 C192 256 92 256 92 256
           C92 256 192 256 218 222 C244 188 256 80 256 80 Z"
        fill="#16a34a"/>

  <!-- Center circle — white core -->
  <circle cx="256" cy="256" r="28" fill="#ffffff"/>

  <!-- 4 node dots at tips of sparkle -->
  <circle cx="256" cy="72"  r="12" fill="#4ade80"/>
  <circle cx="256" cy="440" r="12" fill="#4ade80"/>
  <circle cx="84"  cy="256" r="12" fill="#4ade80"/>
  <circle cx="428" cy="256" r="12" fill="#4ade80"/>

  <!-- "ai" wordmark — bottom band -->
  <rect x="0" y="400" width="512" height="112" rx="0" fill="#0f172a" opacity="0.85"/>
  <rect x="0" y="456" width="512" height="56" rx="0" fill="#0f172a"/>
  <!-- Green bottom-corner radii to match overall shape -->
  <rect x="0" y="400" width="512" height="56" fill="#0f172a" opacity="0.85"/>

  <!-- "ai" text in the bottom band -->
  <text x="256" y="478"
        font-family="Arial,Helvetica,sans-serif"
        font-size="96"
        font-weight="900"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-4">ai</text>

  <!-- Green dot on the "i" -->
  <circle cx="326" cy="390" r="14" fill="#4ade80"/>
</svg>
