name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saas_test
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]

    env:
      DJANGO_SETTINGS_MODULE: saas_starter.settings.development
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgres://saas:saas@localhost:5432/saas_test
      REDIS_URL: redis://localhost:6379/0
      DEBUG: "True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run tests
        run: pytest --cov=. --cov-report=term-missing -q
