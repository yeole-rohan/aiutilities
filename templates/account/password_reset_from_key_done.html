<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password updated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body style="font-family:'Inter',system-ui,sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;">

  <div style="width:100%;max-width:22rem;">

    <div style="text-align:center;margin-bottom:2rem;">
      <a href="/" style="font-size:1.125rem;font-weight:700;color:#0f172a;text-decoration:none;letter-spacing:-.01em;">⚡ SaaS App</a>
    </div>

    <div class="app-card" style="padding:2rem;text-align:center;">

      <div style="width:3.5rem;height:3.5rem;border-radius:50%;background:#f0fdf4;border:2px solid #bbf7d0;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;">
        <svg style="width:1.5rem;height:1.5rem;color:#16a34a;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
      </div>

      <h1 style="font-size:1.25rem;font-weight:700;color:#0f172a;margin-bottom:.5rem;">Password updated</h1>
      <p style="font-size:.875rem;color:#64748b;line-height:1.6;margin-bottom:2rem;">
        Your password has been changed successfully. You can now sign in with your new password.
      </p>

      <a href="{% url 'account_login' %}" class="app-btn app-btn-primary app-btn-block">
        Sign in
      </a>

    </div>

  </div>

</body>
</html>
